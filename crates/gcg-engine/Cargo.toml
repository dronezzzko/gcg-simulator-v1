[package]
name = "gcg-engine"
description = "Deterministic Gundam Card Game rules engine (Comprehensive Rules 1.9.0) for gcg-sim"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gcg-core.workspace = true
gcg-data.workspace = true
gcg-effects.workspace = true
serde_json.workspace = true

[features]
# Scenario builder and private-state constructors for tests (A18). Purely additive.
testkit = []
# Cache-transparency and rules-management self-checks (W-49, W-124). Never in shipped builds.
paranoid = []

[dev-dependencies]
# The crate's own tests (crates/gcg-engine/tests/**, workstream C) use the testkit (A18).
gcg-engine = { workspace = true, features = ["testkit"] }
